.score{font:800 56px/1 Bahnschrift,"DIN Alternate","Arial Narrow",Impact,sans-serif;margin:0}
.msg{margin:4px 0 14px;color:var(--mute)}
.grid{font-size:26px;letter-spacing:2px;margin:0 0 14px}
h2{font-size:16px;margin:24px 0 10px}
.bars div{display:grid;grid-template-columns:18px 1fr 28px;gap:8px;align-items:center;font-size:14px;margin-bottom:4px}
.bars i{display:block;height:16px;min-width:3px;border-radius:3px;background:var(--line)}
.bars .me i{background:var(--ok)}

.cd{font-variant-numeric:tabular-nums;font-weight:700}
.foot{margin-top:26px;font-size:13px;color:var(--mute)}

.link{font:inherit;font-size:14px;color:var(--mute);background:none;border:0;padding:0;margin:14px 0 0;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.tbar{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px;overflow:hidden}

.tile{font-size:13px}
</style>

  if(t.dataset.k!==undefined){if(G&&!G.rev&&G.a.length<G.P.length)answer(+t.dataset.k);return}
  if(t.id==="next"){G.rev=false;render();window.scrollTo(0,0);return}
  if(t.id==="menu"){V="menu";render();return}
  if(t.id==="again"){start(G.mode,G.make);return}
  if(t.id==="copy"){const done=()=>{t.textContent="Copied"};try{navigator.clipboard.writeText(shareText).then(done,()=>{t.textContent="Copy failed"})}catch(err){t.textContent="Copy failed"}return}
  const go=t.dataset.go;
  if(go==="daily")daily();
  else if(go==="timed")start("timed",()=>pick(()=>1,5));
  else if(go==="interview"){V="topic";render()}
  else if(go==="custom"){V="diff";render()}
  else if(t.dataset.topic!==undefined){const tp=t.dataset.topic;start("interview",()=>pick(r=>r[2]&&(!tp||r[0]===tp),10))}
  else if(t.dataset.diff){const d=t.dataset.diff;start("custom",()=>pick(r=>r[1]===d,5))}
});
function tick(){
  if(today()!==DAY){location.reload();return}
  const el=$("#cd");if(!el)return;
  const d=new Date(),m=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  let s=Math.max(0,Math.floor((m-d)/1000));
  const p=v=>String(v).padStart(2,"0");
  el.textContent=p(Math.floor(s/3600))+":"+p(Math.floor(s%3600/60))+":"+p(s%60);
}
setInterval(tick,1000);
render();
</script>
